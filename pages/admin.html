<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin | Blog Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">Rupesh<span>Admin</span></div>
    <nav>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="blog.html">View Blog</a></li>
        <li><a href="admin.html" class="active">Admin Panel</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Admin Section -->
  <section class="admin-section">
    <h1>Admin Panel</h1>

    <!-- Login Form -->
    <div id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button onclick="login()">Login</button>
    </div>

    <!-- Blog Form (hidden until login) -->
    <div id="blogFormContainer" style="display:none;">
      <h2>Add New Blog</h2>
      <form id="blogForm" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Blog Title" required>
        <textarea name="content" placeholder="Blog Content" required></textarea>
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Publish Blog</button>
      </form>
    </div>

    <!-- Existing Posts Preview -->
    <div id="adminPosts" style="margin-top:30px;"></div>
  </section>

  <!-- Script -->
  <script>
    let token = null;

    async function login() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass })
      });

      const data = await res.json();
      if (data.success) {
        token = data.token;
        document.getElementById('loginForm').style.display = "none";
        document.getElementById('blogFormContainer').style.display = "block";
        loadAdminPosts();
      } else {
        alert("Invalid credentials!");
      }
    }

    document.getElementById('blogForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);

      const res = await fetch('/api/add-post', {
        method: 'POST',
        headers: { "x-admin-key": token },
        body: formData
      });

      const msg = await res.text();
      alert(msg);
      if (res.ok) {
        e.target.reset();
        loadAdminPosts();
      }
    });

    async function loadAdminPosts() {
      try {
        const res = await fetch('/api/posts');
        const posts = await res.json();
        const container = document.getElementById('adminPosts');
        container.innerHTML = "<h2>Existing Posts</h2>";

        if (!posts || posts.length === 0) {
          container.innerHTML += "<p>No blog posts yet.</p>";
          return;
        }

        posts.forEach((post, index) => {
          const div = document.createElement('div');
          div.className = 'blog-post';
          div.innerHTML = `
            ${post.image ? `<img src="${post.image}" alt="Blog Image">` : ''}
            <h3>${post.title}</h3>
            <p class="date">${post.date}</p>
            <p>${post.content}</p>
            <button onclick="deletePost(${index})">Delete</button>
            <button onclick="editPost(${index})">Edit</button>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        console.error("Error loading posts:", err);
        document.getElementById('adminPosts').innerHTML = "<p>Failed to load posts.</p>";
      }
    }

    async function deletePost(index) {
      const res = await fetch(`/api/delete-post/${index}`, {
        method: 'DELETE',
        headers: { "x-admin-key": token }
      });
      const msg = await res.text();
      alert(msg);
      if (res.ok) loadAdminPosts();
    }

    async function editPost(index) {
      const newTitle = prompt("Enter new title:");
      const newContent = prompt("Enter new content:");
      if (!newTitle && !newContent) return;

      const formData = new FormData();
      if (newTitle) formData.append('title', newTitle);
      if (newContent) formData.append('content', newContent);

      const res = await fetch(`/api/edit-post/${index}`, {
        method: 'PUT',
        headers: { "x-admin-key": token },
        body: formData
      });
      const msg = await res.text();
      alert(msg);
      if (res.ok) loadAdminPosts();
    }
  </script>
</body>
</html>
